name: Build data and deploy
on:
  push:
    branches: [main]
    paths: ['reports/**', 'data/**', 'index.html', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pandas openpyxl
      - name: Convert new Excel reports
        run: python scripts/convert.py
      - name: Save converted data back to the repository
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add -A data reports
          git diff --cached --quiet || (git commit -m "Update dashboard data" && git push)
      - name: Assemble website
        run: mkdir _site && cp index.html _site/ && cp -r data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
